name: CAS189
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  CAS189:
    path: ..

targets:
  CAS189:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: CAS189
        product: CAS189Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.cas189
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 189秒传
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 189秒传
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 189 的下载地址可能走明文 HTTP（家庭云返回的直链），默认 ATS 会拦截
        NSAppTransportSecurity:
          NSExceptionDomains:
            cloud.189.cn:
              NSIncludesSubdomains: true
              NSAllowsInsecureHTTPLoads: true
            api.cloud.189.cn:
              NSIncludesSubdomains: true
              NSAllowsInsecureHTTPLoads: true
            upload.cloud.189.cn:
              NSIncludesSubdomains: true
              NSAllowsInsecureHTTPLoads: true
            preview.cloud.189.cn:
              NSIncludesSubdomains: true
              NSAllowsInsecureHTTPLoads: true
            open.e.189.cn:
              NSIncludesSubdomains: true
              NSAllowsInsecureHTTPLoads: true
            web.189.cn:
              NSIncludesSubdomains: true
              NSAllowsInsecureHTTPLoads: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.local.cas189.refresh
        UIBackgroundModes:
          - fetch
        # 让「文件」App 能看到本 App 的 Documents，并支持共享/打开方式导入
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: 秒传凭证
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.item
schemes:
  CAS189:
    build:
      targets:
        CAS189: all
    run:
      config: Debug
