name: qinghe-ios

permissions:
  contents: write

on:
  push:
    branches: [qinghe-ios]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (macOS)
        run: swift test

  build-ipa:
    needs: core-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project App/Qinghe.xcodeproj \
            -scheme Qinghe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Qinghe.app" Payload/
          zip -qry Qinghe-unsigned.ipa Payload
          ls -lh Qinghe-unsigned.ipa

      - name: Publish IPA (catbox)
        run: |
          url=$(curl -sS --max-time 120 -F "reqtype=fileupload" \
                 -F "fileToUpload=@Qinghe-unsigned.ipa" \
                 https://catbox.moe/user/api.php || true)
          echo "IPA_URL=$url" >> "$GITHUB_ENV"
          echo "catbox: $url"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qinghe-latest
          name: Qinghe iOS (unsigned)
          body: |
            未签名 IPA。安装：AltStore / Sideloadly 自签。
            核心：Haijiao 列表/详情 + HLS AES-128（key XOR jpg material）解密播放。
          files: Qinghe-unsigned.ipa
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: Qinghe-unsigned-ipa
          path: Qinghe-unsigned.ipa
          retention-days: 14
