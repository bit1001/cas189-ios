name: iOS

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 1) 核心包：Linux 跑单测（便宜、快）
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build all products
        run: swift build

      - name: swift test
        run: swift test --parallel

  # 2) App：macOS 上生成工程并编译（不签名）
  build-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build (unsigned, simulator)
        run: |
          xcodebuild \
            -project App/CAS189.xcodeproj \
            -scheme CAS189 \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Collect app bundle
        run: |
          APP=$(find build/Build/Products -name "CAS189.app" -maxdepth 3 | head -1)
          echo "APP=$APP"
          mkdir -p artifacts
          if [ -n "$APP" ]; then cp -R "$APP" artifacts/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: CAS189-simulator-app
          path: artifacts
          if-no-files-found: warn

  # 3) 真机 arm64 未签名 .ipa（TrollStore 直接装 / Sideloadly 会重签）
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: App
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild \
            -project App/CAS189.xcodeproj \
            -scheme CAS189 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "CAS189.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload CAS189-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CAS189-unsigned.ipa Payload
          ls -lh CAS189-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CAS189-unsigned-ipa
          path: CAS189-unsigned.ipa

      # 4) 把未签名 IPA 上传到公共临时文件站，拿到直链（仓库私有，产物 API 需要 token）
      - name: Upload to public host
        run: |
          set -e
          echo "=== catbox ==="
          CATBOX_URL=$(curl -s --max-time 120 -F "reqtype=fileupload" -F "fileToUpload=@CAS189-unsigned.ipa" https://catbox.moe/user/api.php || true)
          echo "CATBOX: $CATBOX_URL"
          echo "=== tmpfiles ==="
          TMP_URL=$(curl -s --max-time 120 -F "file=@CAS189-unsigned.ipa" https://tmpfiles.org/api/v1/upload | python3 -c "import sys,json;print(json.load(sys.stdin)['data']['url'])" 2>/dev/null || echo "tmpfiles 失败")
          echo "TMPFILES: $TMP_URL"
          echo ""
          echo "DOWNLOAD_LINKS:"
          echo "$CATBOX_URL"
          echo "$TMP_URL"
          {
            echo "commit: ${{ github.sha }}"
            echo "catbox: $CATBOX_URL"
            echo "tmpfiles: $TMP_URL"
          } > ci-links.txt

      # 5) 把直链写进 ci-artifacts 分支（GitHub 产物 API 需要 token，git 是现成的通道）
      - name: Publish download links to branch
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b ci-artifacts
          git add ci-links.txt
          git commit -m "ci: 最新构建的下载直链"
          git push -f origin ci-artifacts
